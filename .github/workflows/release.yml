name: Manual Release Pipeline

on:
  workflow_dispatch:
    inputs:
      deploy_qa:
        description: "Deploy to QA?"
        required: true
        type: boolean
      deploy_uat:
        description: "Deploy to UAT?"
        required: true
        type: boolean
      deploy_live:
        description: "Deploy to LIVE?"
        required: true
        type: boolean

jobs:
  release:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Tags
        run: git fetch --tags

      - name: Calculate Next Version
        id: version
        shell: powershell
        run: |
          $tags = git tag --sort=-v:refname
          if ($tags.Count -eq 0) {
            $newVersion = "v1.0.0"
          } else {
            $latest = $tags[0]
            $parts = $latest.TrimStart("v").Split(".")
            $major = $parts[0]
            $minor = $parts[1]
            $patch = [int]$parts[2] + 1
            $newVersion = "v$major.$minor.$patch"
          }
          echo "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Create Release Branch
        run: |
          git checkout -b release/${{ steps.version.outputs.version }}
          git push origin release/${{ steps.version.outputs.version }}

      - name: Create Tag
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Build Solution
        run: |
          "C:\Program Files (x86)\MSBuild\14.0\Bin\MSBuild.exe" CICD3.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Deploy Files
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\CICD3\bin\Release"

          if (${{ inputs.deploy_qa }}) {
            Copy-Item "$source\*" "D:\Publish New\Environments\MyApp\QA" -Recurse -Force
            Restart-WebAppPool -Name "MyApp-QA"
          }

          if (${{ inputs.deploy_uat }}) {
            Copy-Item "$source\*" "D:\Publish New\Environments\MyApp\UAT" -Recurse -Force
            Restart-WebAppPool -Name "MyApp-UAT"
          }

          if (${{ inputs.deploy_live }}) {
            Copy-Item "$source\*" "D:\Publish New\Environments\MyApp\LIVE" -Recurse -Force
            Restart-WebAppPool -Name "MyApp-LIVE"
          }