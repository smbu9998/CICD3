name: Manual Release Pipeline

on:
  workflow_dispatch:
    inputs:
      deploy_qa:
        description: "Deploy to QA?"
        required: true
        type: boolean
      deploy_uat:
        description: "Deploy to UAT?"
        required: true
        type: boolean
      deploy_live:
        description: "Deploy to LIVE?"
        required: true
        type: boolean

jobs:
  release:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Tags
        run: git fetch --tags

      - name: Calculate Next Version
        id: version
        shell: powershell
        run: |
          $tags = git tag --sort=-v:refname

          if (-not $tags) {
              $newVersion = "v1.0.0"
          }
          else {
              $latest = ($tags | Select-Object -First 1).ToString()
              $clean = $latest.TrimStart("v")
              $parts = $clean.Split(".")
              $major = $parts[0]
              $minor = $parts[1]
              $patch = [int]$parts[2] + 1
              $newVersion = "v$major.$minor.$patch"
          }

          echo "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Create Release Branch
        run: |
          git checkout -b release/${{ steps.version.outputs.version }}
          git push origin release/${{ steps.version.outputs.version }}

      - name: Create Tag
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Restore NuGet Packages
        shell: powershell
        run: |
          & "C:\tools\nuget.exe" restore "CICD3.sln"

      - name: Publish Web Application
        shell: powershell
        run: |
          & "C:\Program Files (x86)\MSBuild\14.0\Bin\MSBuild.exe" `
            "CICD3\CICD3.csproj" `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:PublishUrl="${{ github.workspace }}\PublishedOutput"


      - name: Deploy Files
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\CICD3\bin\Release"

          Write-Host "Using source path: $source"

          if (!(Test-Path $source)) {
              Write-Error "Source path not found: $source"
              exit 1
          }

          if ("${{ inputs.deploy_qa }}" -eq "true") {
            Copy-Item "$source\*" "D:\Publish New\Environments\MyApp\QA" -Recurse -Force
            Restart-WebAppPool -Name "MyApp-QA"
          }

          if ("${{ inputs.deploy_uat }}" -eq "true") {
            Copy-Item "$source\*" "D:\Publish New\Environments\MyApp\UAT" -Recurse -Force
            Restart-WebAppPool -Name "MyApp-UAT"
          }

          if ("${{ inputs.deploy_live }}" -eq "true") {
            Copy-Item "$source\*" "D:\Publish New\Environments\MyApp\LIVE" -Recurse -Force
            Restart-WebAppPool -Name "MyApp-LIVE"
          }